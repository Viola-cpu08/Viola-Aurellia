<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Login-box">
        <div class="login-header">
            <header>Reset Password</header>
        </div>

        <p style="font-size: 13px; color: #666; margin-bottom: 20px; text-align: center;">
            Masukkan email Anda untuk instruksi pemulihan kata sandi.
        </p>

        <div class="input-box">
            <input type="email" class="input-field" placeholder="Enter your email" autocomplete="off" required>
        </div>

        <div class="Input-submit">
            <a href="reset-succes.html">
                <button type="button" class="submit-btn">Send Reset Link</button>
            </a>
        </div>

        <div class="register-link" style="margin-top: 15px; text-align: center;">
            <p>Remembered your password? <a href="index.html">Login</a></p>
        </div>
    </div>
</body>
</html>
